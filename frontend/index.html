<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml/png" href="https://img.freepik.com/premium-vector/modern-letter-p-logo-design-stylish-alphabet-p-vector-branding_1190297-48087.jpg?semt=ais_hybrid&w=740&q=80" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porto - Build Your Portfolio</title>
    <script>
      // Check for saved theme preference or default to light
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
