<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml/png" href="https://img.magnific.com/premium-vector/professional-vector-logo-design-with-gradient-colors-letter-p-companies-people-busin_1002026-130.jpg?semt=ais_hybrid&w=740&q=80" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porto - Build Your Portfolio</title>
    <script>
      // Check for saved theme preference or default to light
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
